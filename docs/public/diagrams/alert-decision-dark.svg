<text x="88" y="70" font-size="17" font-weight="650" fill="#dfdfd6" text-anchor="start">One listing, in order</text>
<text x="88" y="92" font-size="13" font-weight="400" fill="#98989f" text-anchor="start">the first check a listing fails stops it</text>

<g transform="translate(88 122) scale(0.75)" fill="none" stroke="#98989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g><text x="116" y="136" font-size="14" font-weight="600" fill="#dfdfd6" text-anchor="start">Eligible</text><text x="116" y="155" font-size="12.5" font-weight="400" fill="#98989f" text-anchor="start">in stock, with a price and a URL</text>
<text x="592" y="141" font-size="12.5" font-weight="400" fill="#6a6a71" text-anchor="end">else: nothing</text>
<path d="M88 169 H592" stroke="#5c5c63" stroke-width="1" opacity="0.4"/>
<g transform="translate(88 188) scale(0.75)" fill="none" stroke="#98989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4" /><line x1="10" x2="3" y1="4" y2="4" /><line x1="21" x2="12" y1="12" y2="12" /><line x1="8" x2="3" y1="12" y2="12" /><line x1="21" x2="16" y1="20" y2="20" /><line x1="12" x2="3" y1="20" y2="20" /><line x1="14" x2="14" y1="2" y2="6" /><line x1="8" x2="8" y1="10" y2="14" /><line x1="16" x2="16" y1="18" y2="22" /></g><text x="116" y="202" font-size="14" font-weight="600" fill="#dfdfd6" text-anchor="start">Tuning</text><text x="116" y="221" font-size="12.5" font-weight="400" fill="#98989f" text-anchor="start">not a muted model or never-show</text>
<text x="592" y="198.5" font-size="12.5" font-weight="400" fill="#6a6a71" text-anchor="end">tuned: muted-price</text>
<text x="592" y="215.5" font-size="12.5" font-weight="400" fill="#6a6a71" text-anchor="end">notice or nothing</text>
<path d="M88 235 H592" stroke="#5c5c63" stroke-width="1" opacity="0.4"/>
